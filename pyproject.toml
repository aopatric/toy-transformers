[project]
name = "toy-transformers"
version = "0.1.0"
description = "Replicating A Mathematical Framework for Transformer Circuits with toy models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
