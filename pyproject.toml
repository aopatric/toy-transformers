[project]
name = "toy-transformers"
version = "0.1.0"
description = "Replicating A Mathematical Framework for Transformer Circuits with toy models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy",
    "pyarrow>=25.0.1",
    "tokenizers>=0.23.2",
    "torch",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_ckpt: needs a gpu and checkpoints/1l_attn_mixed.pt (run unsandboxed)"]
